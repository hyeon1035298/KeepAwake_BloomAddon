# The add-on's names, set here only. build.sh hands this file to PillTaskbar's
# tools/build-addon.sh, whose addon/addon.conf describes every key.
# Paths are relative to this file's folder. Lists are space separated.

ADDON_ID="keep-awake"
ADDON_NAME="KeepAwake"
ADDON_VERSION="0.1.3"
ADDON_MOD_SRC="mod/keep-awake.wh.cpp"
ADDON_MOD_VERSION="0.1.3"
# Never a Windhawk mod; an id no one uses keeps the Windhawk check quiet.
ADDON_WINDHAWK_MODS="local@keep-awake"
# The taskbar.dll symbols that lead to the taskbar's XAML.
ADDON_SYMBOL_MODULES="taskbar.dll"
# The schema (the awake settings, and pill.theme and pill.glass, which Bloom sets to its
# own look) is this folder's settings.schema.json; build.sh adds it to the bundle.
ADDON_SCHEMA="0"
ADDON_VALUES_DEFAULTS=""
ADDON_THIRD_PARTY="THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="커피"
ADDON_NAME_EN="Coffee"
ADDON_ABOUT_KO="작업표시줄의 커피잔을 눌러 PC와 화면이 잠들지 않게 붙잡아 둡니다"
ADDON_ABOUT_EN="A coffee cup on the taskbar keeps the computer and the screen awake"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/KeepAwake_BloomAddon"
ADDON_MIN_BLOOM="0.19.0"
ADDON_NEEDS=""
